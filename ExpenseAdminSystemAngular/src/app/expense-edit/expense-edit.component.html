<h2>Edit Expense</h2>

<form (ngSubmit)="editExpense()" #expenseForm="ngForm">
  <div>
    <label>Amount:</label>
    <input type="number" [(ngModel)]="expense.amount" name="amount" required />
  </div>

  <div>
    <label>Expense Date:</label>
    <input type="date" [(ngModel)]="expense.expenseDate" name="expenseDate" required />
  </div>

  <div>
    <label>Category ID:</label>
    <input type="number" [(ngModel)]="expense.categoryId" name="categoryId" required />
  </div>

  <div>
    <label>Currency ID:</label>
    <input type="number" [(ngModel)]="expense.currencyId" name="currencyId" required />
  </div>

  <div>
    <label>Comments:</label>
    <input type="text" [(ngModel)]="expense.comments" name="comments" />
  </div>

  <button type="submit">Submit</button>
</form>
